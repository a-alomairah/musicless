<!doctype html><html lang="{{ language }}" dir="{{ 'rtl' if language == 'ar' else 'ltr' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf" content="{{ session.csrf }}"><title>Musicless</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"><script src="{{ url_for('static',filename='app.js') }}" defer></script></head><body><script id="translations" type="application/json">{{ translations|tojson }}</script><header><a class="brand" href="/">◉ Musicless</a><span>{{ t('Keep the voice.') }}</span>{% if session.get('role') == 'admin' %}<nav><a href="/settings">{{ t('Settings') }}</a><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="quiet">{{ t('Sign out') }}</button></form></nav>{% else %}<nav><a href="/login">{{ t('Admin sign in') }}</a></nav>{% endif %}<form class="language-switch" action="/language" method="post" aria-label="{{ t('Language') }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="next" value="{{ request.path }}"><button name="language" value="en" lang="en" aria-pressed="{{ 'true' if language == 'en' else 'false' }}">ENG</button><button name="language" value="ar" lang="ar" aria-pressed="{{ 'true' if language == 'ar' else 'false' }}">ARA</button></form></header><main>{% block content %}{% endblock %}</main><footer>{{ t('Local processing runs on this server, not in your browser.') }} <a href="/privacy">{{ t('Processing, storage & retention') }}</a></footer></body></html>
