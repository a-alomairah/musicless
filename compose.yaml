services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      MODEL_REGISTRY: /config/models.json
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - data:/data
      - ${CONFIG_DIR:-./config}:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    # CUDA uses device nodes, not network connectivity.
    network_mode: none
    init: true
    environment:
      DATA_DIR: /data
      MODEL_REGISTRY: /config/models.json
      MODELS_DIR: /models
      ALLOW_CPU: ${ALLOW_CPU:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-250}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-120}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-900}
      RETENTION_SECONDS: ${RETENTION_SECONDS:-3600}
      DISK_FLOOR_MB: ${DISK_FLOOR_MB:-2048}
      JOB_STORAGE_MB: ${JOB_STORAGE_MB:-1536}
    volumes:
      - data:/data
      - ${CONFIG_DIR:-./config}:/config:ro
      - ${MODELS_DIR:-./models}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${WORKER_MEMORY_LIMIT:-16g}
    cpus: ${WORKER_CPUS:-4}
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, -m, musicless.health]
      start_period: 120s
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}
